<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Sistema de Rifas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1400px;
            margin: 0 auto;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .content {
            padding: 30px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 15px 25px;
            text-align: center;
            background: #f8f9fa;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            min-width: 120px;
        }

        .tab.active {
            background: #667eea;
            color: white;
            border-bottom-color: #4CAF50;
        }

        .tab:hover:not(.active) {
            background: #e9ecef;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }

        .table th, .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .table th {
            background: #f8f9fa;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .table tr:hover {
            background: #f8f9fa;
        }

        .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .status.criado {
            background: #fff3cd;
            color: #856404;
        }

        .status.em_validacao {
            background: #cce5ff;
            color: #004085;
        }

        .status.pago {
            background: #d4edda;
            color: #155724;
        }

        .status.cancelado {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: opacity 0.2s;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        .login-form {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .login-form h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #667eea;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .numbers-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            margin: 15px 0;
        }

        .number-preview {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #2196f3;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .content {
                padding: 20px;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                min-width: auto;
            }
            
            .table {
                font-size: 12px;
            }
            
            .table th, .table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎲 Administração - Sistema de Rifas</h1>
            <p>Gerencie sua rifa online</p>
        </div>

        <div class="content">
            <div id="loginForm" class="login-form">
                <h2>🔐 Login Admin</h2>
                <div id="loginMessage" class="alert"></div>
                
                <div class="form-group">
                    <label for="adminPassword">Senha de Admin:</label>
                    <input type="password" id="adminPassword" placeholder="Digite sua senha">
                </div>
                
                <button class="btn" onclick="loginAdmin()">Entrar</button>
            </div>

            <div id="adminPanel" style="display: none;">
                <div class="tabs">
                    <div class="tab active" onclick="showTab('config')">⚙️ Configuração</div>
                    <div class="tab" onclick="showTab('participants')">👥 Participantes</div>
                    <div class="tab" onclick="showTab('numbers')">🎫 Números</div>
                </div>

                <div id="tab-config" class="tab-content active">
                    <h2>Configuração da Rifa</h2>
                    <div id="configMessage" class="alert"></div>
                    
                    <div class="form-group">
                        <label for="rifaName">Nome da Rifa:</label>
                        <input type="text" id="rifaName" placeholder="Ex: Rifa Hugo Medeiros - iPhone 17">
                    </div>
                    
                    <div class="form-group">
                        <label for="rifaDescription">Descrição:</label>
                        <textarea id="rifaDescription" rows="3" placeholder="Descrição da rifa..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="unitValue">Valor Unitário (€):</label>
                        <input type="number" id="unitValue" step="0.01" min="0" placeholder="5.00">
                    </div>
                    
                    <div class="form-group">
                        <label for="totalNumbers">Total de Números:</label>
                        <input type="number" id="totalNumbers" min="10" placeholder="100">
                    </div>
                    
                    <div class="form-group">
                        <label for="iban">IBAN (Pagamento):</label>
                        <input type="text" id="iban" placeholder="PT50 0000 0000 0000 0000 0000 0">
                    </div>
                    
                    <div class="form-group">
                        <label for="adminEmail">Email de Admin para notificações:</label>
                        <input type="email" id="adminEmail" placeholder="admin@exemplo.com">
                    </div>
                    
                    <button class="btn btn-success" onclick="saveConfig()">💾 Salvar Configuração</button>
                    <button class="btn" onclick="resetRaffle()" style="margin-left: 10px;">🔄 Reiniciar Rifa</button>
                </div>

                <div id="tab-participants" class="tab-content">
                    <h2>Gerenciamento de Participantes</h2>
                    
                    <div style="margin-bottom: 20px;">
                        <input type="text" id="searchParticipant" placeholder="Pesquisar participantes..." onkeyup="searchParticipants()">
                    </div>
                    
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Telemóvel</th>
                                <th>Números</th>
                                <th>Total Pago</th>
                                <th>Estado</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="participantsTable">
                            <!-- Dados preenchidos via JavaScript -->
                        </tbody>
                    </table>
                </div>

                <div id="tab-numbers" class="tab-content">
                    <h2>Gerenciamento de Números</h2>
                    
                    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <div style="flex: 1;">
                            <label for="freeNumbers">Números Livres (separados por vírgula):</label>
                            <textarea id="freeNumbers" placeholder="10,20,30,40,50"></textarea>
                        </div>
                        <div style="flex: 1;">
                            <label for="reservedNumbers">Números Reservados (formato: número, nome):</label>
                            <textarea id="reservedNumbers" placeholder="401, Nuno Neves
402, Pedro Sousa"></textarea>
                        </div>
                    </div>
                    
                    <button class="btn btn-success" onclick="updateNumbers()">💾 Atualizar Números</button>
                    
                    <h3 style="margin-top: 30px;">Preview de Números</h3>
                    <div id="numbersPreview">
                        <!-- Preview gerado via JavaScript -->
                    </div>
                </div>

                <div style="margin-top: 30px; text-align: center;">
                    <button class="btn btn-danger" onclick="logoutAdmin()">🚪 Sair do Painel Admin</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let allParticipants = [];
        let allNumbers = { free: [], reserved: {} };
        const airtableConfig = {
            baseId: '<?= config.airtable.baseId ?>',
            apiKey: '<?= config.airtable.apiKey ?>',
            tableName: '<?= config.airtable.tableName ?>'
        };

        // Login function
        function loginAdmin() {
            const password = document.getElementById('adminPassword').value;
            const message = document.getElementById('loginMessage');
            
            if (password === '<?= config.adminPassword ?>') {
                currentUser = 'admin';
                message.innerHTML = '✅ Login realizado com sucesso!';
                message.className = 'alert success';
                message.style.display = 'block';
                
                setTimeout(() => {
                    message.style.display = 'none';
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    loadAdminData();
                }, 1000);
            } else {
                message.innerHTML = '❌ Senha inválida!';
                message.className = 'alert error';
                message.style.display = 'block';
            }
        }

        // Load admin data
        async function loadAdminData() {
            try {
                // Load config
                const response = await fetch(`https://api.airtable.com/v0/${airtableConfig.baseId}/${airtableConfig.tableName}?filterByFormula=AND({Ativo}='true')`, {
                    headers: {
                        'Authorization': `Bearer ${airtableConfig.apiKey}`
                    }
                });
                
                const data = await response.json();
                
                if (data.records && data.records.length > 0) {
                    allParticipants = data.records.map(record => ({
                        id: record.id,
                        data: record.fields['Data/Hora'] || '',
                        nome: record.fields['Nome'] || '',
                        email: record.fields['Email'] || '',
                        telemovel: record.fields['Telemóvel'] || '',
                        numeros: record.fields['Números Escolhidos'] || '',
                        total: record.fields['Total a Pagar'] || '',
                        estado: record.fields['Estado'] || 'criado',
                        referencia: record.fields['Referência de Pagamento'] || ''
                    }));
                }
                
                displayParticipants(allParticipants);
                
            } catch (error) {
                console.error('Error loading admin data:', error);
                showMessage('Erro ao carregar dados. Recarregue a página.', 'error');
            }
        }

        // Display participants
        function displayParticipants(participants) {
            const tableBody = document.getElementById('participantsTable');
            tableBody.innerHTML = '';
            
            participants.forEach((participant, index) => {
                const row = tableBody.insertRow();
                row.innerHTML = `
                    <td>${participant.data}</td>
                    <td>${participant.nome}</td>
                    <td>${participant.email}</td>
                    <td>${participant.telemovel}</td>
                    <td>${participant.numeros}</td>
                    <td>€${participant.total}</td>
                    <td><span class="status ${participant.estado}">${participant.estado}</span></td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn btn-success" onclick="updateParticipantStatus(${index}, 'pago')" title="Marcar como Pago">✓</button>
                            <button class="action-btn btn-danger" onclick="updateParticipantStatus(${index}, 'cancelado')" title="Cancelar">×</button>
                        </div>
                    </td>
                `;
            });
        }

        // Search participants
        function searchParticipants() {
            const searchTerm = document.getElementById('searchParticipant').value.toLowerCase();
            const filtered = allParticipants.filter(p => 
                p.nome.toLowerCase().includes(searchTerm) ||
                p.email.toLowerCase().includes(searchTerm) ||
                p.numeros.toLowerCase().includes(searchTerm)
            );
            displayParticipants(filtered);
        }

        // Update participant status
        async function updateParticipantStatus(index, newStatus) {
            const participant = allParticipants[index];
            
            try {
                const response = await fetch(`https://api.airtable.com/v0/${airtableConfig.baseId}/${airtableConfig.tableName}/${participant.id}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${airtableConfig.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fields: {
                            'Estado': newStatus,
                            'Data Pagamento': newStatus === 'pago' ? new Date().toISOString() : null
                        }
                    })
                });
                
                const result = await response.json();
                
                if (result.id) {
                    participant.estado = newStatus;
                    displayParticipants(allParticipants);
                    showMessage('Estado atualizado com sucesso!', 'success');
                } else {
                    showMessage('Erro ao atualizar estado', 'error');
                }
            } catch (error) {
                console.error('Error updating status:', error);
                showMessage('Erro ao atualizar estado', 'error');
            }
        }

        // Display numbers preview
        function displayNumbersPreview() {
            const container = document.getElementById('numbersPreview');
            container.innerHTML = '';
            
            if (allNumbers.free.length > 0) {
                container.innerHTML += '<h4>Números Livres:</h4><div class="numbers-preview">';
                allNumbers.free.forEach(num => {
                    container.innerHTML += `<div class="number-preview">${num}</div>`;
                });
                container.innerHTML += '</div>';
            }
            
            if (Object.keys(allNumbers.reserved).length > 0) {
                container.innerHTML += '<h4>Números Reservados:</h4><div style="max-height: 200px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 4px;">';
                for (const [num, nome] of Object.entries(allNumbers.reserved)) {
                    container.innerHTML += `<div style="display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #eee;"> <span><strong>${num}:</strong> ${nome}</span></div>`;
                }
                container.innerHTML += '</div>';
            }
        }

        // Show message
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `alert ${type}`;
            messageDiv.textContent = message;
            
            const container = document.querySelector('.content');
            container.insertBefore(messageDiv, container.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }

        // Tab switching
        function showTab(tabName) {
            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // Add active class to current tab and show content
            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // Save config
        async function saveConfig() {
            const config = {
                'Nome da Rifa': document.getElementById('rifaName').value,
                'Descrição': document.getElementById('rifaDescription').value,
                'Valor Unitário': parseFloat(document.getElementById('unitValue').value || '0'),
                'Total de Números': parseInt(document.getElementById('totalNumbers').value || '0'),
                'IBAN': document.getElementById('iban').value,
                'Email Admin': document.getElementById('adminEmail').value,
                'Ativo': true,
                'Data de Atualização': new Date().toISOString()
            };
            
            try {
                // First, find existing config record
                const findResponse = await fetch(`https://api.airtable.com/v0/${airtableConfig.baseId}/${airtableConfig.tableName}?filterByFormula=AND({Ativo}='true')`, {
                    headers: {
                        'Authorization': `Bearer ${airtableConfig.apiKey}`
                    }
                });
                
                const findData = await findResponse.json();
                let configId = null;
                
                if (findData.records && findData.records.length > 0) {
                    // Update existing record
                    configId = findData.records[0].id;
                    const updateResponse = await fetch(`https://api.airtable.com/v0/${airtableConfig.baseId}/${airtableConfig.tableName}/${configId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${airtableConfig.apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ fields: config })
                    });
                    
                    if (updateResponse.ok) {
                        showMessage('Configuração salva com sucesso!', 'success');
                    } else {
                        throw new Error('Erro ao salvar configuração');
                    }
                } else {
                    // Create new record
                    const createResponse = await fetch(`https://api.airtable.com/v0/${airtableConfig.baseId}/${airtableConfig.tableName}`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${airtableConfig.apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ fields: config })
                    });
                    
                    if (createResponse.ok) {
                        showMessage('Configuração salva com sucesso!', 'success');
                    } else {
                        throw new Error('Erro ao salvar configuração');
                    }
                }
                
                loadAdminData();
                
            } catch (error) {
                console.error('Error saving config:', error);
                showMessage('Erro ao salvar configuração', 'error');
            }
        }

        // Update numbers
        async function updateNumbers() {
            const freeNumbers = document.getElementById('freeNumbers').value;
            const reservedNumbers = document.getElementById('reservedNumbers').value;
            
            allNumbers = {
                free: freeNumbers.split(',').map(n => n.trim()).filter(n => n),
                reserved: {}
            };
            
            // Parse reserved numbers (format: "401, Nuno Neves")
            const lines = reservedNumbers.split('\n');
            lines.forEach(line => {
                const [num, nome] = line.split(',').map(s => s.trim());
                if (num && nome) {
                    allNumbers.reserved[num] = nome;
                }
            });
            
            displayNumbersPreview();
            
            showMessage('Números atualizados com sucesso!', 'success');
        }

        // Reset raffle
        async function resetRaffle() {
            if (confirm('Tem certeza que deseja reiniciar a rifa? Todos os dados serão apagados.')) {
                try {
                    // Find and deactivate existing records
                    const findResponse = await fetch(`https://api.airtable.com/v0/${airtableConfig.baseId}/${airtableConfig.tableName}?filterByFormula=AND({Ativo}='true')`, {
                        headers: {
                            'Authorization': `Bearer ${airtableConfig.apiKey}`
                        }
                    });
                    
                    const findData = await findResponse.json();
                    
                    if (findData.records && findData.records.length > 0) {
                        for (const record of findData.records) {
                            await fetch(`https://api.airtable.com/v0/${airtableConfig.baseId}/${airtableConfig.tableName}/${record.id}`, {
                                method: 'PATCH',
                                headers: {
                                    'Authorization': `Bearer ${airtableConfig.apiKey}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ fields: { 'Ativo': false } })
                            });
                        }
                    }
                    
                    showMessage('Rifa reiniciada com sucesso!', 'success');
                    loadAdminData();
                    
                } catch (error) {
                    console.error('Error resetting raffle:', error);
                    showMessage('Erro ao reiniciar rifa', 'error');
                }
            }
        }

        // Logout
        function logoutAdmin() {
            currentUser = null;
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
        }
    </script>
</body>
</html>
